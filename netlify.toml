# ضع هذا الملف في جذر (root) مستودع GitHub — بنفس مستوى مجلدَي frontend و backend

[build]
  base = "frontend"          # التطبيق داخل مجلد frontend
  command = "npm run build"  # أمر البناء
  publish = "build"          # مجلد الناتج بعد البناء

[build.environment]
  CI = "false"                      # يمنع فشل البناء بسبب التحذيرات
  NPM_FLAGS = "--legacy-peer-deps"  # لتوافق React 19 مع react-scripts

# يمنع خطأ 404 عند تحديث الصفحة أو فتح رابط داخلي (لأن الموقع SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
